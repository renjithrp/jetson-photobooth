name: PhotoBooth
options:
  bundleIdPrefix: com.renjithrp
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: J6QU4CTJD7
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "2"          # iPad only (booth kiosk device)
targets:
  PhotoBooth:
    type: application
    platform: iOS
    sources:
      - path: PhotoBooth
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.renjithrp.photobooth
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon   # PhotoBooth/Assets.xcassets
    entitlements:
      path: PhotoBooth/PhotoBooth.entitlements
      properties:
        com.apple.developer.networking.HotspotConfiguration: true
    info:
      path: PhotoBooth/Info.plist
      properties:
        CFBundleDisplayName: PhotoBooth
        # Declares no non-exempt encryption (the app only speaks plain HTTP/TLS to
        # the booth). Without it every TestFlight build stops for a manual export
        # compliance answer before testers can install.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        NSCameraUsageDescription: "Take a selfie to find your photos."
        NSLocalNetworkUsageDescription: "Connect to the photo booth on this network."
        NSPhotoLibraryAddUsageDescription: "Save booth photos to this iPad's photo library."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
