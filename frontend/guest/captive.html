<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Photo Booth</title>
<link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
<!-- Rendered inside the phone's Wi-Fi sign-in window, which cannot open the camera.
     Its ONLY job is to get the guest into Safari, where the camera works — there is
     deliberately no "connected" confirmation here, because the guest can already see
     they connected and it just delayed them.

     The automatic hand-off below is kept but is NOT relied on: WebKit wants a user
     gesture before navigating to an app scheme, and it was observed being ignored.
     So the whole page is a tap target for the same link — a tap anywhere counts as
     the gesture and goes to Safari. -->
<meta http-equiv="refresh" content="0;url=__SAFARI_URL__">
<script>location.replace("__SAFARI_URL__");</script>
<style>
  :root { --bg:#0d0f14; --card:#171a21; --fg:#f1f3f7; --mut:#9aa3b2; --accent:#5b8cff; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; min-height:100%; }
  body { background:var(--bg); color:var(--fg); text-align:center;
         padding:34px 20px 40px;
         font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  a { text-decoration:none; }
  .go { display:block; background:var(--accent); color:#fff; border-radius:18px;
        padding:26px 20px; font-size:1.5rem; font-weight:800; line-height:1.25;
        max-width:26rem; margin:0 auto; box-shadow:0 8px 26px rgba(91,140,255,.35); }
  .go small { display:block; font-size:.95rem; font-weight:600; opacity:.9;
              margin-top:8px; }
  .dl { display:block; background:#fff; color:#0d9488; border-radius:16px;
        padding:20px; font-size:1.2rem; font-weight:800; max-width:26rem;
        margin:0 auto 20px; }
  .dl small { display:block; font-size:.9rem; font-weight:600; opacity:.75; margin-top:6px; }
  .steps { color:var(--mut); font-size:.9rem; line-height:1.7; margin:30px auto 0;
           max-width:26rem; }
  .addr { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; color:var(--fg);
          font-weight:700; }
</style>
</head>
<body onclick="location.href='__SAFARI_URL__'">
  <!-- Photos already picked on the booth iPad: works right here, no Safari needed. -->
  <a class="dl" id="pending" style="display:__PENDING_DISPLAY__" href="__PENDING_URL__">
    __PENDING_TITLE__
    <small>Tap to download</small>
  </a>

  <a class="go" href="__SAFARI_URL__">
    Open the photo booth
    <small>Opens in Safari &mdash; the camera doesn&rsquo;t work in this window</small>
  </a>

  <p class="steps">
    Nothing happened? Tap <b>Cancel</b> (top-left), then <b>Use Without Internet</b>,
    open <b>Safari</b> and go to <span class="addr">__BOOTH_HOST__</span>
    <br>(or <span class="addr">__BOOTH_IP__</span>)
  </p>
</body>
</html>
