<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Photo Booth</title>
<style>
  :root { --accent:#5eead4; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; background:#000;
    font-family:system-ui,Segoe UI,Roboto,sans-serif; color:#fff; cursor:none; }
  #preview { position:fixed; inset:0; width:100%; height:100%; object-fit:cover; }
  .layer { position:fixed; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; gap:24px;
    transition:opacity .3s; }
  .hidden { opacity:0; pointer-events:none; }
  .big { font-size:18vw; font-weight:800; text-shadow:0 4px 30px #000a; }
  .title { font-size:5vw; font-weight:800; text-shadow:0 3px 20px #000c; }
  .sub { font-size:2.4vw; opacity:.9; text-shadow:0 2px 10px #000c; }
  .scrim { background:radial-gradient(ellipse at center,#0006,#000a); }
  /* light treatment so the live video stays clearly visible while waiting */
  .scrim-bottom { background:linear-gradient(to top,#000c 0%,#0006 16%,#0000 42%);
    justify-content:flex-end; padding-bottom:7vh; }
  .flash { position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; }
  .flash.on { opacity:.9; transition:opacity .05s; }
  .spinner { width:90px;height:90px;border:9px solid #fff3;border-top-color:var(--accent);
    border-radius:50%; animation:spin 1s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg);} }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.06)} }
  #attract .title { animation:pulse 2.5s ease-in-out infinite; }
  /* review: captured photo full-screen, QR pinned bottom-right */
  .review-main { position:fixed; inset:0; width:100%; height:100%; object-fit:contain; background:#000; }
  .thanks-banner { position:fixed; top:3vh; left:0; right:0; text-align:center;
    font-size:3.2vw; font-weight:800; text-shadow:0 3px 16px #000d; }
  .qr-corner { position:fixed; right:3vh; bottom:3vh; display:flex; align-items:center; gap:14px;
    background:#0008; padding:14px 18px; border-radius:18px; box-shadow:0 8px 30px #0009; }
  .qr { background:#fff; padding:10px; border-radius:12px; }
  .qr img { width:170px; height:170px; display:block; }
  .qr-cap { font-size:1.6vw; font-weight:700; line-height:1.2; text-shadow:0 2px 8px #000c; }
  /* attract-screen guest onboarding: join Wi-Fi + find-your-photos QR pair */
  .join-corner { position:absolute; right:3vh; bottom:3vh; display:flex; gap:2vh; }
  .join-card { display:flex; flex-direction:column; align-items:center; gap:8px; }
  .join-card .qr img { width:14vh; height:14vh; }
  .join-cap { font-size:1.3vw; font-weight:700; line-height:1.25; text-align:center;
              text-shadow:0 2px 8px #000c; }
  .join-cap span { font-weight:600; opacity:.85; font-size:1.1vw; }
  #joincorner.hidden, #findcard.hidden { display:none; }
  #ipbadge { position:fixed; left:14px; bottom:12px; font-size:1.1vw; opacity:.7;
    background:#0007; padding:6px 12px; border-radius:999px; }
  #cambadge { position:fixed; right:14px; top:12px; font-size:1.2vw; font-weight:700;
    background:#b91c1ccc; padding:8px 14px; border-radius:999px; display:none; }
  .accent { color:var(--accent); }
  #facezone { position:fixed; border:4px dashed rgba(45,212,191,.9);
    border-radius:18px; box-shadow:0 0 0 9999px rgba(0,0,0,.28); pointer-events:none;
    display:flex; align-items:flex-start; justify-content:center; z-index:5;
    transition:opacity .3s; }
  #facezone span { margin-top:-2.6rem; background:rgba(13,148,136,.92); color:#fff;
    font-weight:700; padding:.3rem 1rem; border-radius:999px; font-size:1.4rem; }
  #facezone.hidden { display:none; }
  svg.ic { width:1em; height:1em; stroke:currentColor; fill:none; stroke-width:2;
    stroke-linecap:round; stroke-linejoin:round; vertical-align:-.12em; }
</style>
</head>
<body>
  <img id="preview" alt="">
  <canvas id="gestcanvas" style="position:fixed;inset:0;pointer-events:none;z-index:4"></canvas>
  <div id="geststats" style="display:none;position:fixed;left:14px;top:14px;z-index:6;
    font:600 1.15vw/1.5 ui-monospace,Menlo,monospace;background:#000b;color:#a7f3d0;
    padding:10px 14px;border-radius:12px;white-space:pre;pointer-events:none"></div>
  <div id="facezone" class="hidden"><span>Stand here <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg></span></div>
  <div class="flash" id="flash"></div>

  <div class="layer scrim-bottom" id="attract">
    <div class="title"><svg class="ic" viewBox="0 0 24 24"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg> <span id="boothName">AI Photo Booth</span></div>
    <div class="sub" id="welcome">Show your hand ✋ to start!</div>
    <div class="join-corner hidden" id="joincorner">
      <div class="join-card">
        <div class="qr"><img id="joinqr" alt="Join Wi-Fi QR"></div>
        <div class="join-cap">1. Scan to join Wi-Fi<br><span id="joinssid"></span></div>
      </div>
      <div class="join-card hidden" id="findcard">
        <div class="qr"><img id="findqr" alt="Find your photos QR"></div>
        <div class="join-cap">2. Scan to get<br>your photos</div>
      </div>
    </div>
  </div>

  <div class="layer scrim-bottom hidden" id="idle">
    <div class="title" id="welcome2">Show your hand ✋ to start!</div>
  </div>

  <div class="layer hidden" id="countdown"><div class="big" id="count">3</div></div>

  <div class="layer scrim hidden" id="capturing"><div class="title">Smile — hold it! <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg></div>
    <div class="sub" id="shotinfo">Capturing…</div></div>

  <div class="layer scrim hidden" id="processing">
    <div class="spinner"></div><div class="sub">Working some magic…</div></div>

  <div class="layer hidden" id="review">
    <img class="review-main" id="reviewMain" alt="">
    <div class="qr-corner" id="qrwrap">
      <div class="qr"><img id="qr" alt="QR"></div>
      <div class="qr-cap">Scan to<br>download</div>
    </div>
  </div>

  <div class="layer scrim hidden" id="error"><div class="title"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg> Oops</div>
    <div class="sub" id="errmsg"></div></div>

  <div id="ipbadge">admin: loading…</div>
  <div id="cambadge"><svg class="ic" viewBox="0 0 24 24"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg> Camera reconnecting…</div>

<script>
const L = id => document.getElementById(id);
const layers = ["attract","idle","countdown","capturing","processing","review","error"];
let attractTimer = null, attractAfter = 60;
let previewUrl = "";

// gesture -> emoji + friendly name, so the welcome reflects the configured trigger.
// Put {gesture} (emoji) and/or {gesture_name} in the welcome message to auto-fill;
// a bare "✋"/"hand" in the message is also swapped to match the selected gesture.
const GEST = {
  open_palm:["✋","your hand"], wave:["👋","a wave"], fist:["✊","a fist"], peace:["✌️","the peace sign"],
  thumbs_up:["👍","a thumbs up"], three:["🤟","three fingers"], rock:["🤘","the rock sign"],
  one:["☝️","one finger"], pinky:["🤙","your pinky"], call_me:["🤙","the call-me sign"],
  love:["🤟","the love sign"], any_hand:["🖐","your hand"]
};
function gestureText(msg, gtype){
  const g = GEST[gtype] || GEST.any_hand;
  let out = (msg || "Show {gesture} to start!");
  if(!/\{gesture/.test(out)) out = out.replace("✋", "{gesture}");   // legacy default
  // A wave is a motion, not a pose — tell guests to "wave", not "show".
  if(gtype === "wave") out = out.replace(/^Show\b/, "Wave");
  return out.replace(/\{gesture_name\}/g, g[1]).replace(/\{gesture\}/g, g[0]);
}
let faceZone = null;        // {x,y,w,h} normalised, or null when face gating is off
let curState = "attract";
let mirror = true;          // selfie-mirror the live preview so guests position naturally

function renderFaceZone(){
  const el = L("facezone");
  const show = faceZone && (curState === "attract" || curState === "idle");
  if(!show){ el.classList.add("hidden"); return; }
  // The preview is object-fit:cover — map the normalised zone onto the covered area.
  const img = L("preview");
  const iw = img.naturalWidth || 4, ih = img.naturalHeight || 3;
  const vw = window.innerWidth, vh = window.innerHeight;
  const scale = Math.max(vw/iw, vh/ih);
  const dw = iw*scale, dh = ih*scale, ox = (vw-dw)/2, oy = (vh-dh)/2;
  // when the preview is mirrored, flip the zone's x so the guide lines up with what's shown
  const zx = mirror ? (1 - faceZone.x - faceZone.w) : faceZone.x;
  el.style.left = (ox + zx*dw) + "px";
  el.style.top  = (oy + faceZone.y*dh) + "px";
  el.style.width  = (faceZone.w*dw) + "px";
  el.style.height = (faceZone.h*dh) + "px";
  el.classList.remove("hidden");
}
window.addEventListener("resize", renderFaceZone);

function setPreview(){
  if(!previewUrl){ return; }
  // cache-buster forces a fresh MJPEG connection (reconnects after a stream drop)
  L("preview").src = previewUrl + (previewUrl.includes("?") ? "&" : "?") + "t=" + Date.now();
}

function show(name){
  curState = name;
  layers.forEach(n => L(n).classList.toggle("hidden", n !== name));
  // Hide the live preview while a shot is being processed/reviewed. The Sony
  // camera briefly streams a post-capture review image (and the MJPEG <img> holds
  // its last frame while the stream pauses), so without this the just-taken photo
  // flashes behind the spinner before the review screen appears.
  // Hide the live preview during the shot too: the Sony pauses live view while it
  // autofocuses + captures + downloads (~3s), so leaving it visible showed a frozen
  // frame. The "Smile — hold it!" screen covers that window cleanly instead.
  L("preview").style.visibility =
    (name === "capturing" || name === "processing" || name === "review") ? "hidden" : "visible";
  if (name !== "attract" && name !== "idle" && name !== "countdown"){
    clearGesture();
    L("geststats").style.display = "none";
  }
  renderFaceZone();
}
function scheduleAttract(){
  clearTimeout(attractTimer);
  attractTimer = setTimeout(()=>show("attract"), attractAfter*1000);
}

async function loadInfo(){
  try{
    const r = await fetch("/api/system/info"); const j = await r.json();
    L("ipbadge").textContent = "admin: " + j.admin_url;
    // Show the badge only on a REAL outage — not during the ~7s self-heal after a
    // brief USB drop (cs.recovering). A short blip stays silent; a sustained gap
    // (gap > grace, or the camera genuinely gone) shows "camera reconnecting".
    const cs = j.camera_stream;
    const unhealthy = cs ? (!cs.streaming && !cs.recovering) : (j.daemon_connected === false);
    L("cambadge").style.display = unhealthy ? "block" : "none";
    const s = await (await fetch("/api/settings")).json();
    attractAfter = s.timer.attract_after_seconds || 60;
    mirror = s.preview.mirror !== false;
    gestureOverlay = !!(s.trigger && s.trigger.show_gesture_overlay);
    if (!gestureOverlay) clearGesture();
    gestureStats = !!(s.trigger && s.trigger.show_gesture_stats);
    if (!gestureStats) L("geststats").style.display = "none";
    L("preview").style.transform = mirror ? "scaleX(-1)" : "none";
    renderFaceZone();
    L("boothName").textContent = s.general.booth_name;
    const wel = gestureText(s.general.welcome_message, s.trigger && s.trigger.gesture_type);
    L("welcome").textContent = wel;
    L("welcome2").textContent = wel;
    L("ipbadge").style.display = s.general.show_ip_overlay ? "block" : "none";
    // preview comes through the backend; (re)connect if not already showing
    previewUrl = (j.preview_enabled && j.preview_url) ? j.preview_url : "";
    if (previewUrl && !L("preview").getAttribute("src")) setPreview();
    faceZone = (j.require_face && j.face_zone) ? j.face_zone : null;
    renderFaceZone();
  }catch(e){ console.warn(e); }
}

async function loadWifi(){
  // Single "join Wi-Fi" QR on the attract screen when the guest hotspot is up.
  // On joining, the phone's captive-portal popup auto-opens the find-your-photos
  // page (served over HTTP on :80 by backend/captive.py) — one scan does both.
  try{
    const w = await (await fetch("/api/wifi/info")).json();
    if (w.active && w.join_qr){
      L("joinqr").src = w.join_qr;
      L("joinssid").textContent = w.ssid || "";
      // Second QR: opens the find-your-photos page. Needed in pass-through mode,
      // where joining the hotspot does NOT auto-open a captive portal page.
      if (w.find_qr){ L("findqr").src = w.find_qr; L("findcard").classList.remove("hidden"); }
      else { L("findcard").classList.add("hidden"); }
      L("joincorner").classList.remove("hidden");
    } else {
      L("joincorner").classList.add("hidden");
    }
  }catch(e){ L("joincorner").classList.add("hidden"); }
}

function onEvent(ev){
  switch(ev.type){
    case "idle": show("idle"); scheduleAttract(); break;
    case "countdown": clearTimeout(attractTimer); show("countdown"); L("count").textContent = ev.value; break;
    case "capturing":
      show("capturing"); L("shotinfo").textContent = ev.total>1 ? `Shot 1 of ${ev.total}` : "Capturing…";
      flash(); break;
    case "shot":
      L("shotinfo").textContent = ev.total>1 ? `Shot ${ev.index} of ${ev.total}`:""; flash(); break;
    case "processing": show("processing"); break;
    case "review":
      show("review");
      L("reviewMain").src = (ev.images && ev.images[0]) || "";
      if (ev.qr){ L("qr").src = ev.qr; L("qrwrap").style.display="flex"; }
      else { L("qrwrap").style.display="none"; }
      break;
    case "error": show("error"); L("errmsg").textContent = ev.message||""; break;
    case "gesture":
      if (gestureOverlay) drawGesture(ev);
      renderStats(ev);
      break;
    // admin saved settings: apply overlay/stats toggles + texts right away
    case "settings": loadInfo(); loadWifi(); break;
  }
}
function flash(){ const f=L("flash"); f.classList.add("on"); setTimeout(()=>f.classList.remove("on"),120); }

// ---- gesture debug overlay (admin: trigger.show_gesture_overlay) ------------
// Draws the worker's live verdict on the video: hand skeleton (green = pose
// matches, amber = hand seen but wrong pose, red = rejected as a face mis-read),
// a hold-progress ring, and a one-line reason — so you can SEE why a gesture
// does or doesn't fire.
let gestureOverlay = false;
let gestureStats = false;
let gestClearTimer = null;

// Live numbers panel: the raw values behind every gate, so the thresholds in
// admin (min size, face scale, confirm frames, match ratio…) can be tuned
// against what the detector actually measures.
function renderStats(ev){
  const el = L("geststats");
  const live = curState === "attract" || curState === "idle" || curState === "countdown";
  if (!gestureStats || !live){ el.style.display = "none"; return; }
  el.style.display = "block";
  const pct = v => v == null ? "–" : Math.round(v*100) + "%";
  const yn = v => v === true ? "✓" : v === false ? "✗" : "–";
  el.textContent = !ev.hand ? ("no hand" + (ev.tune_mode ? "   [TUNE MODE]" : "")) :
`want ${ev.want}   hands ${ev.hands ?? 1}   score ${ev.score ?? "–"}${ev.tune_mode ? "   [TUNE MODE]" : ""}
span ${pct(ev.span)}   min ${pct(ev.min_size)}   face_h ${ev.face_h ? pct(ev.face_h) : "–"}
pose ${yn(ev.match)}   size ${yn(ev.size_ok)}   in_frame ${yn(ev.in_frame)}
near_face ${yn(ev.near_face)}   on_face ${ev.on_face ? "YES" : "no"}
streak ${ev.streak ?? 0}   hold ${pct(ev.hold_progress)}   ratio ${pct(ev.hold_ratio)}   cooldown ${ev.cooldown_left ?? 0}s`;
}
// MediaPipe hand skeleton: landmark index pairs
const HAND_BONES = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],
  [10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
function clearGesture(){
  const c = L("gestcanvas");
  c.getContext("2d").clearRect(0,0,c.width,c.height);
}
function drawGesture(ev){
  // Only over the LIVE preview — never on top of the captured-photo screens
  // (capturing/processing/review show the shot, not the camera).
  if (curState !== "attract" && curState !== "idle" && curState !== "countdown"){
    clearGesture(); return;
  }
  const c = L("gestcanvas");
  if (c.width !== window.innerWidth || c.height !== window.innerHeight){
    c.width = window.innerWidth; c.height = window.innerHeight;
  }
  const g = c.getContext("2d");
  g.clearRect(0,0,c.width,c.height);
  clearTimeout(gestClearTimer);
  gestClearTimer = setTimeout(clearGesture, 1200);   // fade when updates stop
  if (!ev.hand || !ev.lm) return;
  // map normalised frame coords onto the object-fit:cover preview (like facezone)
  const img = L("preview");
  const iw = img.naturalWidth || 4, ih = img.naturalHeight || 3;
  const scale = Math.max(c.width/iw, c.height/ih);
  const dw = iw*scale, dh = ih*scale, ox = (c.width-dw)/2, oy = (c.height-dh)/2;
  const P = p => [ox + (mirror ? (1-p[0]) : p[0])*dw, oy + p[1]*dh];
  const tooSmall = ev.size_ok === false;
  const col = ev.on_face ? "#f87171"
    : (ev.match && !tooSmall && ev.near_face !== false) ? "#4ade80" : "#fbbf24";
  g.strokeStyle = col; g.fillStyle = col; g.lineWidth = 4; g.lineCap = "round";
  for (const [a,b] of HAND_BONES){
    const [x1,y1] = P(ev.lm[a]), [x2,y2] = P(ev.lm[b]);
    g.beginPath(); g.moveTo(x1,y1); g.lineTo(x2,y2); g.stroke();
  }
  for (const p of ev.lm){
    const [x,y] = P(p);
    g.beginPath(); g.arc(x,y,5,0,7); g.fill();
  }
  // status chip above the wrist + hold-progress ring
  const [wx,wy] = P(ev.lm[0]);
  const reason = (ev.tune_mode && ev.would_fire) ? "WOULD FIRE ✓ (tune mode)"
    : ev.on_face ? "rejected: looks like a face"
    : tooSmall ? `too small/far (${Math.round(ev.span*100)}% < ${Math.round(ev.min_size*100)}%) — pose ignored`
    : ev.near_face === false ? "no face near the hand"
    : !ev.in_frame ? "hand not fully in frame"
    : !ev.match ? `pose ≠ ${ev.want}`
    : ev.cooldown_left > 0 ? `cooldown ${ev.cooldown_left}s`
    : ev.want === "wave" ? `wave ${ev.swings||0}/3 swings`
    : ev.hold_progress > 0 ? `hold ${(ev.hold_progress*ev.hold_need).toFixed(1)}/${ev.hold_need}s`
    : ev.confirming ? "confirming…"
    : ev.want + " ✓";
  g.font = "700 22px system-ui"; g.textAlign = "center";
  const tw = g.measureText(reason).width + 28;
  const bx = Math.min(Math.max(wx, tw/2+8), c.width-tw/2-8), by = Math.max(wy-70, 40);
  g.fillStyle = "#000a";
  g.beginPath(); g.roundRect(bx-tw/2, by-24, tw, 36, 18); g.fill();
  g.fillStyle = col; g.fillText(reason, bx, by+2);
  if (ev.hold_progress > 0){
    g.strokeStyle = "#ffffff55"; g.lineWidth = 6;
    g.beginPath(); g.arc(wx, wy, 34, 0, 2*Math.PI); g.stroke();
    g.strokeStyle = col;
    g.beginPath(); g.arc(wx, wy, 34, -Math.PI/2, -Math.PI/2 + 2*Math.PI*ev.hold_progress); g.stroke();
  }
}

function connectWS(){
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  const ws = new WebSocket(`${proto}//${location.host}/ws`);
  ws.onmessage = e => onEvent(JSON.parse(e.data));
  // reconnect the preview whenever the backend comes back (the stream drops on restart)
  ws.onopen = () => setTimeout(setPreview, 500);
  ws.onclose = () => setTimeout(connectWS, 1500);
}

// Reconnect the MJPEG preview whenever it drops. A hard failure fires `error`,
// but a stream that ENDS cleanly (backend still up) fires `load` instead — for
// multipart/x-mixed-replace Chromium only fires `load` at stream end, not per
// frame — so handle both. Debounced so a server that immediately closes the
// connection can't spin a tight reconnect loop.
let _lastPreviewKick = 0;
function kickPreview(){
  const now = Date.now();
  if (now - _lastPreviewKick < 1400) return;
  _lastPreviewKick = now;
  setPreview();
}
L("preview").onerror = () => setTimeout(kickPreview, 1500);
L("preview").onload  = () => setTimeout(kickPreview, 1500);

loadInfo(); loadWifi(); connectWS(); scheduleAttract();
setInterval(loadInfo, 30000);
setInterval(loadWifi, 30000);
</script>
</body>
</html>
