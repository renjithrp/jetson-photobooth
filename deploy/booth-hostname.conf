# Friendly name for the booth on the guest hotspot, so guests see a hostname
# instead of a bare 192.168.50.1.
#
# Read by the hotspot's NetworkManager shared-mode dnsmasq (which is also the DNS
# server handed to guests over DHCP), so it resolves for anything on PhotoBooth
# Wi-Fi and nowhere else — which is fine, since the booth is only reachable there.
#
# .internal is ICANN-reserved for private networks: it can never be delegated
# publicly, so this can't ever collide with a real domain. (.local is deliberately
# avoided — it's mDNS/Bonjour territory and Apple devices resolve it differently.)
#
# The IP keeps working regardless. A phone using encrypted DNS (DoH/DoT, a private
# DNS profile, iCloud Private Relay) bypasses this resolver and will NOT resolve
# the name — the numeric URL is the fallback for exactly that case.
address=/photos.internal/192.168.50.1
address=/photobooth.internal/192.168.50.1
