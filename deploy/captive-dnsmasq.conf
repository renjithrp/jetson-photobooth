# Captive-portal DNS hijack for the guest 'PhotoBooth' hotspot.
#
# NetworkManager's shared-mode (`ipv4.method shared`) dnsmasq reads every file in
# /etc/NetworkManager/dnsmasq-shared.d/. Resolving ALL names to the booth makes each
# phone's connectivity probe (captive.apple.com, connectivitycheck.gstatic.com,
# www.msftconnecttest.com, …) hit backend/captive.py on :80, which redirects to the
# find-your-photos page — so the captive popup opens automatically right after the
# guest scans the single Wi-Fi QR.
#
# NOTE: guests get NO general internet while on PhotoBooth (every domain points at
# the booth). That's the norm for a grab-your-photos-and-go booth. Remove this file
# and re-activate the AP (`nmcli con up photobooth-ap`) to restore pass-through NAT.
#
# Install: copy to /etc/NetworkManager/dnsmasq-shared.d/  (done by setup-captive.sh)
address=/#/192.168.50.1
