# Hijack ONLY the OS connectivity-probe domains to the booth, so a phone joining
# the hotspot pops its captive-portal sheet (which auto-opens /booth with the
# ready-to-download banner) while ALL other DNS still passes through — guests keep
# real internet, unlike the full address=/#/ hijack.
# Install to /etc/NetworkManager/dnsmasq-shared.d/ (read by the hotspot's dnsmasq).
address=/captive.apple.com/192.168.50.1
address=/connectivitycheck.gstatic.com/192.168.50.1
address=/connectivitycheck.android.com/192.168.50.1
address=/clients3.google.com/192.168.50.1
address=/clients4.google.com/192.168.50.1
address=/msftconnecttest.com/192.168.50.1
address=/www.msftconnecttest.com/192.168.50.1
address=/ipv6.msftconnecttest.com/192.168.50.1
address=/detectportal.firefox.com/192.168.50.1
address=/nmcheck.gnome.org/192.168.50.1
